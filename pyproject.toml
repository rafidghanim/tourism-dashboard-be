[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "tourism-intelligence-backend"
version = "0.1.0"
description = "Public API vertical slice for Tourism Intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0"]
dev = ["ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
